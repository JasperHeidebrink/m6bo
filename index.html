<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Loop de route - M6 BO museum-app</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23000'/%3E%3Cpath d='M6 5h7a4 4 0 0 1 0 8h-2a4 4 0 0 0 0 8h7' fill='none' stroke='%23FF00CA' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --m: #FF00CA; --ml: #FFD6F5; --k: #000; --g: #F2F2F2; --d: #555; }
  * { box-sizing: border-box; }
  html { scroll-padding: 16px 0 100px; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--k); background: var(--g); font-size: 17px; line-height: 1.45; }
  .ico { width: 22px; height: 22px; flex: none; }

  /* Kop met logo */
  header { background: var(--k); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header svg { width: 46px; height: 46px; flex: none; }
  header h1 { margin: 0; font-size: 22px; line-height: 1.2; }
  header p { margin: 0; color: var(--m); font-weight: bold; font-size: 14px; }

  /* Stappen als route met haltes */
  nav { background: #fff; border-bottom: 3px solid var(--k); overflow-x: auto; }
  nav ol { list-style: none; display: flex; margin: 0 auto; padding: 12px 8px 10px; max-width: 860px; }
  nav li { flex: 1 0 86px; position: relative; }
  nav li + li::before { content: ""; position: absolute; top: 19px; left: -50%; width: 100%; border-top: 3px solid var(--k); }
  nav li.gedaan + li::before { border-color: var(--m); }
  nav li.los::before { display: none; }
  nav button { border: 0; background: none; width: 100%; padding: 0 2px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: normal; line-height: 1.2; position: relative; }
  nav button:hover { background: none; }
  nav .stip { width: 42px; height: 42px; border: 3px solid var(--k); border-radius: 50%; background: #fff; display: grid; place-items: center; position: relative; z-index: 1; }
  nav button:hover .stip { background: var(--g); }
  nav li.gedaan .stip { background: var(--m); }
  nav button.act { background: none; color: var(--k); font-weight: bold; }
  nav button.act .stip { background: var(--k); color: #fff; }

  /* Knoppen en velden */
  button { font: inherit; cursor: pointer; border: 3px solid var(--k); background: #fff; color: var(--k); padding: 9px 16px; border-radius: 0; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s, transform .1s; }
  button:hover { background: var(--g); }
  button:active { transform: scale(.97); }
  button.prim { background: var(--m); }
  button.prim:hover { background: #FF5CDD; }
  button.act { background: var(--k); color: #fff; }
  button.klein { padding: 5px 10px; font-size: 15px; border-width: 2px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--m); outline-offset: 2px; }
  nav button:focus-visible { outline-offset: 0; }
  label, .vlabel { display: block; font-weight: bold; margin: 14px 0 4px; }
  input[type=text], textarea { font: inherit; width: 100%; padding: 9px; border: 2px solid var(--k); border-radius: 0; background: #fff; }
  textarea { min-height: 64px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  legend { font-weight: bold; padding: 0; }
  fieldset label { font-weight: normal; margin-top: 8px; }
  .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 480px) { .twee { grid-template-columns: 1fr; } }

  /* Schermen */
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 110px; }
  h2 { font-size: 26px; margin: 0; line-height: 1.2; }
  h3 { font-size: 18px; margin: 0 0 8px; }
  h4 { font-size: 17px; margin: 0 0 2px; }
  h2[tabindex], h3[tabindex], main:focus { outline: none; }
  .hero { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .rond { width: 64px; height: 64px; background: var(--m); border: 3px solid var(--k); border-radius: 50%; display: grid; place-items: center; flex: none; }
  .rond .ico { width: 34px; height: 34px; }
  .stap { font-weight: bold; color: var(--d); text-transform: uppercase; font-size: 13px; letter-spacing: 1px; margin: 0; }
  .uitleg { margin: 2px 0 0; }
  .hint { font-size: 15px; color: var(--d); margin: 0 0 4px; }
  .blok { background: #fff; border: 3px solid var(--k); padding: 16px; margin: 18px 0; box-shadow: 5px 5px 0 var(--k); }
  .blok.roze { background: var(--ml); }
  .blokkop { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .blokkop h3 { margin: 0; }
  .rij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 0; }
  .tip { margin: 10px 0 0; font-size: 15px; }

  /* Schema: tegels met nummer en icoon */
  .schema { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; padding: 0; margin: 0; }
  .schema li { background: #fff; border: 2px solid var(--k); padding: 8px 10px; font-weight: bold; font-size: 15px; line-height: 1.3; }
  .schema li.nu { background: var(--m); }
  .schema .nr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .schema .nr span { background: var(--k); color: #fff; width: 22px; height: 22px; display: grid; place-items: center; font-size: 13px; }
  .schema small { display: block; font-weight: normal; font-size: 13px; }

  /* Tekening van de tafel */
  .tafel { display: block; width: 100%; max-width: 340px; margin: 12px 0 4px; }
  .legenda { list-style: none; padding: 0; margin: 0; font-size: 15px; }
  .legenda li { display: flex; align-items: center; gap: 8px; }
  .legenda i { width: 16px; height: 16px; border: 2px solid var(--k); border-radius: 50%; background: #fff; flex: none; }
  .legenda i.roze { background: var(--m); }

  /* Persona's */
  .avatar { width: 64px; height: 64px; flex: none; }
  .avatar.klein { width: 44px; height: 44px; }
  .personas { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .persona { display: flex; gap: 12px; border: 2px solid var(--k); padding: 12px; }
  .persona ul { list-style: none; padding: 0; margin: 4px 0 0; font-size: 15px; }

  /* Rollen */
  .rollen { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; padding: 0; margin: 0; }
  .rollen li { display: flex; gap: 10px; border: 2px solid var(--k); border-left: 8px solid var(--m); padding: 8px 10px; font-size: 15px; }
  .rollen strong { display: block; font-size: 16px; }

  /* Timer */
  .timerblok { background: #fff; border: 3px solid var(--k); margin: 18px 0; }
  .timerbalk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 14px; }
  .timer { font-size: 30px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .balk { height: 8px; background: var(--g); border-top: 2px solid var(--k); }
  .balk div { height: 100%; background: var(--m); }

  /* Scenariokaart */
  .kaart { display: flex; gap: 14px; align-items: center; background: var(--ml); border: 3px solid var(--k); padding: 18px; margin: 18px 0 10px; box-shadow: 5px 5px 0 var(--m); }
  .kaart .wie { font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
  .kaart .taak { font-size: 22px; font-weight: bold; line-height: 1.25; }

  /* Rondes, cijfer, lijsten */
  .bev { background: #fff; border: 2px solid var(--k); padding: 12px; margin: 10px 0; }
  .tag { display: inline-block; background: var(--k); color: #fff; padding: 2px 8px; font-size: 14px; font-weight: bold; margin-right: 6px; }
  .klein-tekst { font-size: 14px; color: var(--d); }
  .score button { width: 56px; height: 56px; font-size: 22px; justify-content: center; padding: 0; }
  .lijst { list-style: none; padding: 0; margin: 0; }
  .lijst li { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .lijst .vink { width: 28px; height: 28px; border: 2px solid var(--k); border-radius: 50%; display: grid; place-items: center; flex: none; background: #fff; }
  .lijst .vink .ico { width: 16px; height: 16px; }
  .lijst li.ja .vink { background: var(--m); }
  .leegvak { border: 3px dashed var(--k); padding: 12px; min-height: 90px; margin: 12px 0 0; color: var(--d); font-size: 15px; }
  details { margin: 12px 0 0; }
  summary { cursor: pointer; font-weight: bold; padding: 6px 0; }
  textarea.blog { min-height: 240px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; background: #fff; }
  th, td { border: 1px solid var(--k); padding: 8px; text-align: left; vertical-align: top; }
  th { background: var(--k); color: #fff; }
  .melding { background: var(--ml); border: 2px solid var(--k); padding: 10px 14px; margin: 12px 0; font-weight: bold; }
  .antw { white-space: pre-wrap; }
  .leeg { color: var(--d); font-style: italic; }

  /* Balk onderaan */
  .onder { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 3px solid var(--k); padding: 10px 16px; z-index: 5; }
  .onder div { max-width: 728px; margin: 0 auto; display: flex; justify-content: space-between; gap: 8px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -9999px; top: 8px; background: #fff; color: #000; padding: 8px 12px; border: 2px solid var(--k); font-weight: bold; z-index: 10; }
  .skip:focus { left: 8px; }

  /* Animaties */
  @keyframes vooruit { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes terug { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes inkomen { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes draai { from { opacity: 0; transform: rotateX(80deg); } to { opacity: 1; transform: none; } }
  @keyframes plop { from { transform: scale(.5); } 70% { transform: scale(1.1); } to { transform: none; } }
  .scherm.vooruit > :not(.onder) { animation: vooruit .3s ease-out; }
  .scherm.terug > :not(.onder) { animation: terug .3s ease-out; }
  .scherm.vooruit .schema li, .scherm.terug .schema li { animation: inkomen .35s ease-out backwards; }
  .scherm.vooruit .rond, .scherm.terug .rond { animation: plop .4s ease-out .15s backwards; }
  .kaart.nieuw { animation: draai .35s ease-out; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } button:active { transform: none; } }
  @media print {
    * { animation: none !important; }
    body { background: #fff; }
    nav, button, .noprint, .onder { display: none !important; }
    header { background: #fff; color: #000; padding: 0 0 10px; }
    .blok { box-shadow: none; }
    main { padding-bottom: 0; }
  }
</style>
</head>

    VRAGEN.haalbaar.forEach(function (v) { r.push(v[1], a((d.haalbaar || {})[v[0]]), ""); });
    kopje("Top 3");
    d.top.forEach(function (t, i) { r.push((i + 1) + ". Ontdekt: " + a(t.mis), "   Aanpassing: " + a(t.aanpassing), ""); });
    return r.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n\nMIJN SAMENVATTING (IN EIGEN WOORDEN)\n\n\n";
  }
  function kopieer() {
    var tekst = blog(data);
    function klaar(ok) {
      var s = document.getElementById("kopiestatus");
      if (s) s.textContent = ok ? "Gekopieerd. Plak de tekst in een nieuw blog in Simulise." : "Kopiëren lukt niet. Open de blogtekst hieronder en kopieer hem zelf.";
    }
    function oud() {
      try {
        var ta = el("textarea", { "aria-hidden": "true" });
        ta.value = tekst; document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        var k = document.querySelector('[data-f="kopie"]');
        if (k) k.focus();
        return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tekst).then(function () { klaar(true); }, function () { klaar(oud()); });
    else klaar(oud());
  }
  function controle(d) {
    return [
      [vol(d.groep), "Het groepje heeft een naam"],
      [d.namen.slice(0, 3).every(vol), "Minimaal drie namen zijn ingevuld"],
      [d.stories.every(function (s) { return vol(s.story) && vol(s.journey); }), "Vier user stories hebben een journey"],
      [VRAGEN.zelf.every(function (v) { return vol(d.zelf[v[0]]); }), "De zelfcontrole is ingevuld"],
      [d.rondes.length >= 3, "Er zijn minimaal drie testrondes"],
      [vol(d.haalbaar.score) && vol(d.haalbaar.reden), "De haalbaarheid heeft een cijfer en een reden"],
      [d.top.every(function (t) { return vol(t.mis) && vol(t.aanpassing); }), "De top 3 is compleet"]
    ];
  }
  function klaarTab(tab) {
    var c = controle(data), m = { groep: [0, 1], draad: [2], zelf: [3], test: [4], haalbaar: [5], top: [6] };
    return !!m[tab] && m[tab].every(function (n) { return c[n][0]; });
  }
  function tabExport() {
    var blogveld = el("textarea", { id: "blogtekst", class: "blog", readonly: "readonly" });
    blogveld.value = blog(data);
    return el("div", {}, kop("Inleveren", "Controleer, lever in en maak je blog.").concat([
      el("div", { class: "blok" }, [
        el("h3", { text: "Is alles klaar?" }),
        el("ul", { class: "lijst" }, controle(data).map(function (k) {
          return el("li", { class: k[0] ? "ja" : "" }, [el("span", { class: "vink" }, [k[0] ? icoon("vink") : null]), el("span", { class: "sr", text: k[0] ? "Klaar: " : "Nog doen: " }), el("span", { text: k[1] })]);
        }))
      ]),
      el("div", { class: "blok" }, [
        el("h3", { text: "1. Voor je docent" }),
        el("p", { class: "hint", text: "Download het bestand. Lever het in op de plek die je docent noemt." }),
        el("div", { class: "rij" }, [knop("Download JSON-bestand", { class: "prim", onclick: download }, "export")])
      ]),
      el("div", { class: "blok" }, [
        el("h3", { text: "2. Voor Simulise" }),
        el("p", { class: "hint", text: "Ieder maakt een eigen blog. Kopieer de tekst en plak hem in Simulise." }),
        el("div", { class: "rij" }, [
          knop("Kopieer blogtekst", { class: "prim", "data-f": "kopie", onclick: kopieer }, "kopie"),
          knop("Download als tekstbestand", { onclick: function () { bewaarBestand(blog(data), "text/plain;charset=utf-8", "loop-de-route_" + bestandsnaam(data) + "_blog.txt"); } }, "export")
        ]),
        el("p", { id: "kopiestatus", role: "status", class: "tip", style: "font-weight:bold" }),
        el("div", { class: "leegvak" }, [el("strong", { text: "Mijn samenvatting" }), el("p", { style: "margin:4px 0 0", text: "Dit vak is leeg. Vul het zelf in, in Simulise. Schrijf in je eigen woorden wat jij hebt geleerd." })]),
        el("details", {}, [el("summary", { text: "Bekijk de blogtekst" }), el("label", { for: "blogtekst", class: "sr", text: "Blogtekst voor Simulise" }), blogveld])
      ]),
      el("div", { class: "blok" }, [
        el("details", { style: "margin:0" }, [el("summary", { text: "Bekijk alles wat jullie hebben ingevuld" }), toonResultaat(data)])
      ]),
      el("div", { class: "blok" }, [
        el("h3", { text: "Opnieuw beginnen" }),
        el("p", { class: "hint", text: "Dit wist alles op deze laptop. Download eerst het bestand." }),
        el("div", { class: "rij" }, [
          ui.wissen
            ? knop("Ja, wis alles", { class: "act", "data-f": "wisja", onclick: function () { data = leeg(); ui.wissen = false; ui.scenario = null; ui.ronde = {}; bewaar(); ga("groep"); meld("Alles is gewist."); } })
            : knop("Alles wissen", { "data-f": "wissen", onclick: function () { ui.wissen = true; ui.focus = "wisja"; teken(); } }),
          ui.wissen ? knop("Annuleren", { onclick: function () { ui.wissen = false; ui.focus = "wissen"; teken(); } }) : null
        ])
      ]),
      knoppen()
    ]));
  }

  // ---------- Resultaat tonen (ook voor import) ----------
  function va(vraagTekst, antwoord) {
    return el("div", {}, [el("p", { class: "hint", text: vraagTekst }), vol(antwoord) ? el("p", { class: "antw", text: String(antwoord) }) : el("p", { class: "leeg", text: "Niet ingevuld" })]);
  }
  function toonRonde(r) {
    return el("div", {}, [el("p", {}, [el("span", { class: "tag", text: "Scenario" }), el("span", { text: r.scenario || "" })]),
      vol(r.speler) ? el("p", { class: "klein-tekst", text: "Gespeeld door: " + r.speler }) : null]
      .concat(VRAGEN.ronde.map(function (v) { return va(v[1], r[v[0]]); })));
  }
  function toonResultaat(d) {
    var kids = [el("p", { class: "klein-tekst", text: "Leden: " + (d.namen.filter(vol).join(", ") || "-") + ". Onderwerp: " + (d.onderwerp || "-") + ". Getest door: " + (d.getestDoor || "-") + "." })];
    kids.push(el("h3", { text: "Rode draad" }));
    kids.push(el("table", {}, [
      el("thead", {}, [el("tr", {}, [el("th", { scope: "col", text: "Voor wie" }), el("th", { scope: "col", text: "User story" }), el("th", { scope: "col", text: "Journey" })])]),
      el("tbody", {}, d.stories.map(function (s) { return el("tr", {}, [el("td", { text: s.wie || "" }), el("td", { class: "antw", text: s.story || "" }), el("td", { class: "antw", text: s.journey || "" })]); }))
    ]));
    kids.push(el("h3", { text: "Zelfcontrole" }));
    VRAGEN.zelf.forEach(function (v) { kids.push(va(v[1], (d.zelf || {})[v[0]])); });
    kids.push(el("h3", { text: "Testrondes (" + d.rondes.length + ")" }));
    if (!d.rondes.length) kids.push(el("p", { class: "leeg", text: "Geen rondes." }));
    d.rondes.forEach(function (r) { kids.push(el("div", { class: "bev" }, [toonRonde(r)])); });
    kids.push(el("h3", { text: "Haalbaarheid: " + (vol((d.haalbaar || {}).score) ? d.haalbaar.score + " van 5" : "geen cijfer") }));
    VRAGEN.haalbaar.forEach(function (v) { kids.push(va(v[1], (d.haalbaar || {})[v[0]])); });
    kids.push(el("h3", { text: "Top 3" }));
    kids.push(el("table", {}, [
      el("thead", {}, [el("tr", {}, [el("th", { scope: "col", text: "Nr" }), el("th", { scope: "col", text: "Ontdekt" }), el("th", { scope: "col", text: "Aanpassing" })])]),
      el("tbody", {}, d.top.map(function (t, i) { return el("tr", {}, [el("td", { text: String(i + 1) }), el("td", { class: "antw", text: t.mis || "" }), el("td", { class: "antw", text: t.aanpassing || "" })]); }))
    ]));
    return el("div", {}, kids);
  }

  // ---------- Importeren ----------
  function leesBestanden(files) {
    var fouten = [], wacht = files.length;
    if (!wacht) return;
    Array.prototype.forEach.call(files, function (f) {
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (!geldig(d)) throw new Error("vorm");
          d = vulAan(d);
          ui.review = ui.review.filter(function (x) { return x.groep !== d.groep; });
          ui.review.push(d);
        } catch (e) { fouten.push(f.name); }
        klaar();
      };
      r.onerror = function () { fouten.push(f.name); klaar(); };
      r.readAsText(f);
    });
    function klaar() {
      if (--wacht > 0) return;
      ui.review.sort(function (a, b) { return String(a.groep).localeCompare(String(b.groep)); });
      ui.melding = fouten.length ? "Niet gelezen (geen geldig bestand van deze app): " + fouten.join(", ") : "";
      teken();
    }
  }
  function tabImport() {
    var kies = el("input", { type: "file", id: "bestanden", "data-f": "bestanden", accept: ".json,application/json", multiple: "multiple" });
    kies.addEventListener("change", function () { leesBestanden(kies.files); });
    var kids = [
      el("div", { class: "hero" }, [el("div", { class: "rond" }, [icoon("import")]), el("div", {}, [
        el("p", { class: "stap", text: "Voor de docent" }),
        el("h2", { text: "Importeren en review", tabindex: "-1", "data-f": "kop" }),
        el("p", { class: "uitleg", text: "Laad de JSON-bestanden van de groepjes. De bestanden blijven op dit apparaat." })
      ])]),
      el("div", { class: "blok noprint" }, [el("label", { for: "bestanden", style: "margin-top:0", text: "Kies een of meer JSON-bestanden" }), kies]),
      ui.melding ? el("div", { class: "melding", role: "alert", text: ui.melding }) : null
    ];
    if (!ui.review.length) { kids.push(el("p", { class: "leeg", text: "Nog geen bestanden geladen." })); return el("div", {}, kids); }
    kids.push(el("div", { class: "rij noprint" }, [
      knop("Afdrukken", { onclick: function () { window.print(); } }),
      knop("Lijst leegmaken", { onclick: function () { ui.review = []; ui.melding = ""; ui.focus = "bestanden"; teken(); } })
    ]));
    if (ui.review.length > 1) {
      kids.push(el("h3", { style: "margin-top:20px", text: "Overzicht (" + ui.review.length + " groepjes)" }));
      kids.push(el("table", {}, [
        el("thead", {}, [el("tr", {}, ["Groepje", "Onderwerp", "Getest door", "Rondes", "Haalbaarheid", "Compleet"].map(function (t) { return el("th", { scope: "col", text: t }); }))]),
        el("tbody", {}, ui.review.map(function (d) {
          var c = controle(d), ok = c.filter(function (k) { return k[0]; }).length;
          return el("tr", {}, [
            el("th", { scope: "row", text: d.groep || "(geen naam)", style: "background:#fff;color:#000" }),
            el("td", { text: d.onderwerp || "" }), el("td", { text: d.getestDoor || "" }), el("td", { text: String(d.rondes.length) }),
            el("td", { text: vol(d.haalbaar.score) ? d.haalbaar.score + " van 5" : "-" }), el("td", { text: ok + " van " + c.length })
          ]);
        }))
      ]));
    }
    ui.review.forEach(function (d) {
      kids.push(el("div", { class: "blok" }, [
        el("h2", { text: d.groep || "(geen naam)" }),
        toonResultaat(d),
        el("div", { class: "rij noprint" }, [knop("Verder werken met dit bestand", { onclick: function () {
          data = JSON.parse(JSON.stringify(d)); delete data.geexporteerd; bewaar(); ga("groep");
        } })]),
        el("p", { class: "hint noprint", style: "margin-top:6px", text: "Let op: dit vervangt wat nu op deze laptop is ingevuld." })
      ]));
    });
    return el("div", {}, kids);
  }

  // ---------- Tekenen ----------
  var MAAK = { groep: tabGroep, draad: tabDraad, zelf: tabZelf, test: tabTest, haalbaar: tabHaalbaar, top: tabTop, export: tabExport, import: tabImport };
  function ga(tab) {
    stopKlok();
    var volg = STAPPEN.map(function (x) { return x[0]; }).concat(["import"]);
    ui.anim = volg.indexOf(tab) < volg.indexOf(ui.tab) ? "terug" : "vooruit";
    ui.tab = tab; ui.melding = ""; ui.wissen = false; ui.verwijder = -1; ui.focus = "kop";
    var s = STAPPEN[stapNr(tab)];
    ui.sec = s ? s[2] * 60 : 0;
    window.scrollTo(0, 0); teken();
  }
  // Het scherm wordt opnieuw opgebouwd. Daarna gaat de focus terug naar dezelfde knop (data-f),
  // of naar de plek in ui.focus. Zo blijft de app bruikbaar met het toetsenbord.
  function teken() {
    teller = 0;
    var actief = document.activeElement;
    var doel = ui.focus || (actief && actief.getAttribute ? actief.getAttribute("data-f") : "");
    ui.focus = "";
    var nav = document.getElementById("nav");
    nav.textContent = "";
    nav.appendChild(el("ol", {}, STAPPEN.map(function (s, i) { return [s[0], (i + 1) + ".\u00a0" + s[1]]; }).concat([["import", "Importeren en review"]]).map(function (t) {
      var klaar = klaarTab(t[0]), nu = ui.tab === t[0];
      return el("li", { class: (klaar ? "gedaan" : "") + (t[0] === "import" ? " los" : "") }, [
        el("button", { "data-f": "nav-" + t[0], class: nu ? "act" : "", "aria-current": nu ? "page" : false, onclick: function () { ga(t[0]); } }, [
          el("span", { class: "stip" }, [icoon(klaar && !nu ? "vink" : t[0])]),
          el("span", { text: t[1] }),
          klaar ? el("span", { class: "sr", text: " (klaar)" }) : null
        ])
      ]);
    })));
    var main = document.getElementById("main");
    main.textContent = "";
    var scherm = MAAK[ui.tab]();
    scherm.className = "scherm" + (ui.anim ? " " + ui.anim : "");
    ui.anim = "";
    main.appendChild(scherm);
    if (doel) {
      var n = document.querySelector('[data-f="' + doel + '"]');
      if (n) n.focus();
    }
  }
  teken();
})();
</script>
</body>
